{% extends "layout.html" %}
{% block body %}
    <form action="/regist" method="post">
        <input
        type="text"
        name="name"
        autocomplete="off"
        autofocus
        placeholder="please enter your name">

        {% for sport in sports %}
            <input
            type="radio"
            name="sport"
            value="{{ sport }}">{{ sport }}
        {% endfor %}

        <button type="submit">regist</button>
    </form>
{% endblock %}
