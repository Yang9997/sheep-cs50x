{% extends "layout.html" %}
{% block body %}
    <form action="/register" method="post">
        <input type="text" name="name">
        <!-- select option 的关系和 tr td 类似 -->
        <select name="sport">
            {{% for sport in sports %}}
                <option value="{{ sport }}">
                    {{ sport }}
                </option>
            {{% endblock %}}
        </select>
        <button type="submit">ok!</button>
    </form>
{% endblock %}
