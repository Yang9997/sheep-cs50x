<!DOCTYPE html>

<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous"
        >

        <script
            src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous">
        </script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous">
        </script>

        <link href="styles.css" rel="stylesheet">

        <title>OhMyZSheep</title>
    </head>

    <body>

        <div class="page">

            <div class="panel">

                <!-- 顶部一级导航 -->
                <nav class="top-nav">

                    <button
                        class="btn nav-button selected"
                        data-section="courses"
                        type="button"
                    >
                        <span class="nav-text">课程</span>
                    </button>

                    <button
                        class="btn nav-button"
                        data-section="labs"
                        type="button"
                    >
                        <span class="nav-text">实验</span>
                    </button>

                    <button
                        class="btn nav-button"
                        data-section="projects"
                        type="button"
                    >
                        <span class="nav-text">项目</span>
                    </button>

                    <button
                        class="btn nav-button"
                        data-section="about"
                        type="button"
                    >
                        <span class="nav-text">关于我</span>
                    </button>

                    <button
                        class="btn nav-button"
                        data-section="reward"
                        type="button"
                    >
                        <span class="nav-text">奖励时间！</span>
                    </button>

                </nav>


                <!-- 左侧二级导航 -->
                <nav class="side-nav" id="sideNav">

                    <ul id="sideList">
                        <!-- JavaScript 会自动生成这里的内容 -->
                    </ul>

                </nav>


                <!-- 页面主要内容 -->
                <main class="main-content" id="mainContent">

                    <!-- JavaScript 会自动生成这里的内容 -->

                </main>


                <footer class="footer-content">
                    Copyright &#169; OhMyZSheep
                </footer>

            </div>

        </div>


        <script src="script.js"></script>

    </body>

</html>
