<!-- 搜索 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://www.google.com/search" method="get">
        <!-- 类型为搜索 自动补全关闭 打开页面光标自动在搜索框里面 提交名称 搜索框没有内容时显示Query -->
        <input type="search" autocomplete="off" autofocus name="q" placeholder="Query">
        <button>search</button>
    </form>
</body>
</html>
