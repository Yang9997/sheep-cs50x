<!-- css类选择器 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .centered
        {
            text-align: center;
        }

        .large
        {
            font-size: large;
        }

        .medium
        {
            font-size: medium;
        }

        .small
        {
            font-size: small;
        }
    </style>
    <title>css</title>
</head>
<body cladd="centered">
    <header class="larger">
        John Harvard
    </header>
    <main class="medium">
        Welcome to my home page!
    </main>
    <footer class="small">
        Copyright &#169; John Harvard
    </footer>
</body>
</html>
